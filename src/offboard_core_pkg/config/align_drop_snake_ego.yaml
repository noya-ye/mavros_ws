align_drop_snake_ego_node:
  ros__parameters:
    auto_start: true
    setpoint_rate_hz: 20.0

    presetpoint_duration_s: 2.0
    command_timeout_s: 10.0
    command_retry_interval_s: 1.0
    takeoff.height_m: 1.2
    takeoff_tolerance_m: 0.12
    takeoff_timeout_s: 30.0
    land_timeout_s: 15.0
    land_retry_interval_s: 1.0

    ego.goal_topic: /simple_2d_planner/goal
    ego.occupancy_grid_topic: /ego_2d_planner/occupancy_grid
    ego.goal_frame: lidar

    snake.first_axis: y_first
    snake.x_cells: 1
    snake.y_cells: 8
    snake.cell_size_m: 1.2
    snake.hover_s: 0.8
    snake.max_step_m: 0.06
    snake.arrive_xy_m: 0.12
    snake.arrive_z_m: 0.15
    snake.include_start_cell: true

    avoidance.trigger_distance_m: 0.10
    avoidance.occupancy_timeout_s: 0.5
    avoidance.timeout_s: 30.0
    avoidance.occupied_threshold: 50

    align_down.contour_topic: /target/contour_center
    align_down.circle_topic: /target/circle_center
    yolo.detections_topic: /yolo/detections
    align_down.pixels_per_meter: 500.0
    align_down.stable_frames: 2
    align_down.arrive_distance_m: 0.10
    align_down.max_step_m: 0.15  # 单帧水平纠偏的最大步长（米）
    align_down.timeout_s: 15.0
    align_down.detection_timeout_s: 0.5
    align_down.loss_timeout_s: 1.0
    align_down.loss_retry_cooldown_s: 3.0
    align_down.trigger_cooldown_s: 4.0
    align_down.retrigger_radius_m: 1.2  #这个参数很关键，需要根据实际情况调节，过小可能导致频繁重新触发，过大可能导致无法触发

    red_cross_align.enabled: true
    red_cross_align.topic: /target/red_cross_center
    red_cross_align.pixels_per_meter: 450.0
    red_cross_align.stable_frames: 3
    red_cross_align.arrive_distance_m: 0.08
    red_cross_align.max_step_m: 0.15
    red_cross_align.timeout_s: 15.0

    down_drop.land_height_m: 0.1
    down_drop.targets.id0.id: 0
    down_drop.targets.id0.offset_x_m: 0.0
    down_drop.targets.id0.offset_y_m: 0.10
    down_drop.targets.id1.id: 1
    down_drop.targets.id1.offset_x_m: -0.10
    down_drop.targets.id1.offset_y_m: 0.0
    down_drop.targets.id2.id: 2
    down_drop.targets.id2.offset_x_m: 0.10
    down_drop.targets.id2.offset_y_m: 0.0
    down_drop.serial_device: /dev/ttyUSB0
    down_drop.baud_rate: 115200

    ego.use_velocity_ff: true
    ego.use_acceleration_ff: false
    ego.vel_ff_scale: 1.0
    ego.acc_ff_scale: 0.0
    ego.x_sign: 1.0
    ego.y_sign: 1.0
    ego.swap_xy: false
    ego.yaw_align_rad: 0.0
